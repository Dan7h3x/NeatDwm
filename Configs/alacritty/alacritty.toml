[general]
live_config_reload = true
[font]
size = 12

builtin_box_drawing = true

normal = { family = "Maple Mono", style = "Regular" }
bold = { family = "Maple Mono", style = "Bold" }
italic = { family = "Maple Mono", style = "Italic" }
bold_italic = { family = "Maple Mono", style = "Bold Italic" }
#


# [cursor]
# blink_interval = 550
# unfocused_hollow = false
# thickness = 0.85
#
# [cursor.style]
# blinking = "On"
# shape = "Beam"

[selection]
save_to_clipboard = true

[window]
decorations = "Full"
dynamic_title = true
opacity = 0.85
dynamic_padding = true

[window.padding]
x = 0
y = 0

[scrolling]
history = 10000
multiplier = 3

[bell]
animation = "Linear"
duration = 0
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/dialog-error.oga"] }
